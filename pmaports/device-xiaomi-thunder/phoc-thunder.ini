# phoc.ini do xiaomi-thunder, lido pelo phosh-session e pelo greeter (phrog)
# por estar em /etc/phosh/phoc.ini.
#
# Escala inteira: com a escala automatica (2.67) os apps desenham em 3 e o
# phoc reduz cada janela a cada quadro, em software (pixman), numa thread so'.
# Com 3 os buffers chegam no tamanho certo e o compositor so' copia; a tela
# fica com 360 px logicos de largura, a medida para a qual o Phosh foi feito.
# E' so' o valor inicial: a escala continua ajustavel nas Configuracoes.
[output:DSI-1]
scale = 3
